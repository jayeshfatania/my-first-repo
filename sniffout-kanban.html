<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sniffout — Project Board</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand: #2C4A14;
    --brand-mid: #3D6B22;
    --brand-light: #E8F0DC;
    --brand-tint: #F0F7E8;
    --ink: #1a1a1a;
    --ink-2: #555;
    --ink-3: #888;
    --surface: #ffffff;
    --bg: #F7F5F0;
    --border: rgba(0,0,0,0.08);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--brand);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon svg { display: block; }

  .header-title {
    font-size: 20px;
    font-weight: 800;
    color: white;
    letter-spacing: -0.5px;
  }

  .header-subtitle {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin-top: 1px;
  }

  .header-meta {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }

  .header-meta span {
    color: rgba(255,255,255,0.8);
    font-weight: 600;
  }

  /* Stats bar */
  .stats-bar {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 12px 32px;
    display: flex;
    gap: 24px;
    align-items: center;
    overflow-x: auto;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .stat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .stat-dot.backlog { background: var(--ink-3); }
  .stat-dot.progress { background: #E8A020; }
  .stat-dot.done { background: var(--brand); }
  .stat-dot.blocker { background: #C04040; }

  .stat-label { font-size: 12px; color: var(--ink-3); }
  .stat-count { font-size: 14px; font-weight: 700; color: var(--ink); }

  .stat-divider { width: 1px; height: 20px; background: var(--border); }

  /* Board */
  .board {
    padding: 24px 32px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    align-items: start;
  }

  /* Column */
  .column {}

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .column-title {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .column-title-text {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
  }

  .column-count {
    font-size: 11px;
    font-weight: 700;
    background: var(--brand-light);
    color: var(--brand);
    padding: 2px 7px;
    border-radius: 20px;
  }

  .column-count.progress { background: #FFF3D6; color: #B07020; }
  .column-count.done-count { background: var(--brand-light); color: var(--brand); }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
  }

  .card.blocker {
    border-left: 3px solid #C04040;
  }

  .card.owner-action {
    border-left: 3px solid #E8A020;
  }

  .card.done-card {
    opacity: 0.7;
  }

  .card.done-card:hover { opacity: 1; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
    flex: 1;
  }

  .card.done-card .card-title {
    text-decoration: line-through;
    color: var(--ink-3);
  }

  .card-tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tag-dev { background: #E8F0DC; color: #2C4A14; }
  .tag-design { background: #EDE8F7; color: #5C4A8A; }
  .tag-owner { background: #FFF3D6; color: #B07020; }
  .tag-research { background: #E8F5F0; color: #1A6B4A; }
  .tag-blocker { background: #FCE8E8; color: #C04040; }
  .tag-copy { background: #FFF0E8; color: #A04820; }

  .card-body {
    font-size: 12px;
    color: var(--ink-3);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .card-label {
    font-size: 10px;
    color: var(--ink-3);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
  }

  .card-done-check {
    width: 16px;
    height: 16px;
    background: var(--brand);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Section dividers in backlog */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    padding: 8px 4px 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
    margin-top: 8px;
  }

  .section-label:first-child { margin-top: 0; }

  /* Phase 3 banner */
  .phase-banner {
    background: var(--brand);
    color: white;
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 12px;
  }

  .phase-banner-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .phase-banner-body {
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
  }

  /* Footer */
  .footer {
    padding: 16px 32px;
    text-align: center;
    font-size: 11px;
    color: var(--ink-3);
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr; padding: 16px; }
    .header { padding: 12px 16px; }
    .stats-bar { padding: 10px 16px; }
  }
  .card-notes{margin-top:8px;border-top:0.5px solid rgba(0,0,0,0.08);padding-top:8px}
  .card-notes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .card-notes-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#888}
  .card-notes-add{font-size:10px;color:#2C4A14;cursor:pointer;font-weight:600;background:none;border:none;padding:0;font-family:inherit}
  .card-note-item{background:#FFFBF0;border:0.5px solid #F0E0A0;border-radius:6px;padding:6px 8px;font-size:11px;color:#5C4A00;line-height:1.5;margin-bottom:4px}
  .card-note-input-wrap{display:none;margin-top:4px;gap:4px;align-items:center}
  .card-note-input-wrap.visible{display:flex}
  .card-note-input{flex:1;font-size:11px;font-family:inherit;border:0.5px solid rgba(0,0,0,0.1);border-radius:6px;padding:5px 8px;outline:none}
  .card-note-save{font-size:10px;font-weight:600;background:#2C4A14;color:white;border:none;border-radius:6px;padding:5px 10px;cursor:pointer}
  .img-sources{margin-top:10px;border-top:0.5px solid var(--border);padding-top:10px}
  .img-sources-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);margin-bottom:8px}
  .img-source-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--border);font-size:11px}
  .img-source-row:last-child{border-bottom:none}
  .img-source-name{font-weight:600;color:var(--ink);flex:0 0 130px}
  .img-source-desc{color:var(--ink-3);flex:1;line-height:1.4}
  .img-source-tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:20px;white-space:nowrap;flex-shrink:0}
  .tag-free{background:#E8F0DC;color:#2C4A14}.tag-cc{background:#E8F5F0;color:#1A6B4A}
  .card-checklist-toggle{font-size:10px;color:#2C4A14;cursor:pointer;font-weight:600;background:none;border:none;padding:0;font-family:inherit;display:flex;align-items:center;gap:4px;margin-top:8px}
  .card-checklist-toggle:hover{text-decoration:underline}
  .card-checklist-wrap{display:none;margin-top:8px;border-top:0.5px solid rgba(0,0,0,0.08);padding-top:8px;max-height:300px;overflow-y:auto}
  .card-checklist-wrap.open{display:block}
  .card-checklist-progress{font-size:10px;color:#888;margin-bottom:8px;font-weight:600}
  .card-checklist-progress span{color:#2C4A14}
  .walk-check-item{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:0.5px solid rgba(0,0,0,0.05)}
  .walk-check-item:last-child{border-bottom:none}
  .walk-check-item input[type=checkbox]{width:14px;height:14px;accent-color:#2C4A14;flex-shrink:0;cursor:pointer}
  .walk-check-item label{font-size:11px;color:#333;cursor:pointer;line-height:1.4;flex:1}
  .walk-check-item.checked label{color:#aaa;text-decoration:line-through}
  .walk-location{font-size:10px;color:#aaa;white-space:nowrap;flex-shrink:0}
  .add-card-btn{display:block;width:100%;margin-top:10px;padding:9px;background:none;border:1.5px dashed var(--border);border-radius:var(--radius);font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer;font-family:inherit;transition:border-color 0.15s ease,color 0.15s ease,background 0.15s ease;text-align:center}
  .add-card-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-tint)}
  .add-card-btn:active{transform:scale(0.97)}
  .add-card-form{display:none;margin-top:8px;background:var(--surface);border:1.5px solid var(--brand);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
  .add-card-form.visible{display:block}
  .add-card-form input,.add-card-form textarea{display:block;width:100%;font-family:inherit;font-size:12px;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;margin-bottom:8px;background:white;color:var(--ink);outline:none;resize:vertical}
  .add-card-form input:focus,.add-card-form textarea:focus{border-color:var(--brand)}
  .add-card-actions{display:flex;gap:8px;align-items:center}
  .add-card-submit{font-size:12px;font-weight:600;background:var(--brand);color:white;border:none;border-radius:var(--radius-sm);padding:7px 14px;cursor:pointer;font-family:inherit;transition:opacity 0.15s ease}
  .add-card-submit:hover{opacity:0.88}
  .add-card-submit:active{transform:scale(0.97)}
  .add-card-cancel{font-size:12px;font-weight:600;background:none;color:var(--ink-3);border:none;cursor:pointer;font-family:inherit;padding:7px 4px}
  .add-card-cancel:hover{color:var(--ink)}
  .cards.drag-over{background:var(--brand-tint);border-radius:var(--radius);outline:2px dashed var(--brand);outline-offset:3px}
  .card.dragging{opacity:0.35;pointer-events:none}
  .card-move-btn{display:none;font-size:10px;color:var(--brand);cursor:pointer;font-weight:600;background:none;border:none;padding:4px 0 0;font-family:inherit}
  .card-move-btn:hover{text-decoration:underline}
  .card-move-select{display:none;width:100%;font-size:11px;font-family:inherit;border:0.5px solid var(--border);border-radius:6px;padding:5px 8px;margin-top:4px;color:var(--ink);background:white;cursor:pointer}
  @media (hover:none) and (pointer:coarse){.card-move-btn{display:block}}
  .card-edit-btn{display:block;margin-top:6px;font-size:10px;color:var(--ink-3);cursor:pointer;font-weight:600;background:none;border:none;padding:2px 0;font-family:inherit;transition:color 0.15s ease}
  .card-edit-btn:hover{color:var(--brand)}
  .card-edit-btn:active{transform:scale(0.97)}
  .card-edit-panel{display:none;margin-top:8px;border-top:0.5px solid var(--border);padding-top:8px}
  .card-edit-panel.open{display:block}
  .card-edit-panel input,.card-edit-panel textarea{display:block;width:100%;font-family:inherit;font-size:12px;border:0.5px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:6px;background:white;color:var(--ink);outline:none;resize:vertical}
  .card-edit-panel input:focus,.card-edit-panel textarea:focus{border-color:var(--brand)}
  .card-edit-actions{display:flex;gap:6px;align-items:center}
  .card-edit-save{font-size:11px;font-weight:600;background:var(--brand);color:white;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit}
  .card-edit-save:active{transform:scale(0.97)}
  .card-edit-cancel{font-size:11px;font-weight:600;background:none;color:var(--ink-3);border:none;cursor:pointer;font-family:inherit;padding:5px 2px}
  .card-edit-cancel:hover{color:var(--ink)}

  /* === Card detail modal === */
  .card-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
  .card-modal-overlay.open{display:flex;animation:cmo-fade 0.15s ease}
  @keyframes cmo-fade{from{opacity:0}to{opacity:1}}
  .card-modal{background:#fff;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.2);width:100%;max-width:860px;max-height:90vh;overflow-y:auto;position:relative;user-select:text}
  .card-modal-top-bar{height:4px;background:#B85C2C;border-radius:8px 8px 0 0}
  .card-modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 24px 14px;border-bottom:1px solid var(--border)}
  .card-modal-hdr-title{font-size:18px;font-weight:700;color:#2C4A14;line-height:1.4;flex:1;cursor:text;user-select:text;border-radius:4px;padding:2px 4px;margin:-2px -4px;transition:background 0.1s ease;min-width:0;word-break:break-word;outline:none}
  .card-modal-hdr-title[contenteditable="true"]:hover{background:rgba(0,0,0,0.04)}
  .card-modal-hdr-title[contenteditable="true"]:focus{outline:2px solid #B85C2C;outline-offset:2px;background:#fff}
  .card-modal-x{background:none;border:none;cursor:pointer;color:var(--ink-3);padding:2px;line-height:1;border-radius:4px;transition:color 0.15s ease;flex-shrink:0}
  .card-modal-x:hover{color:var(--ink)}
  .card-modal-body{display:flex;gap:24px;padding:20px 24px}
  .card-modal-left{flex:0 0 63%;min-width:0}
  .card-modal-right{flex:1;min-width:0}
  .card-modal-section{margin-bottom:20px}
  .card-modal-slabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(44,74,20,0.55);margin-bottom:8px}
  .card-modal-desc{font-size:13px;color:var(--ink);line-height:1.6;user-select:text;cursor:pointer;border-radius:4px;padding:6px 8px;margin:-6px -8px;transition:background 0.1s ease;min-height:36px}
  .card-modal-desc:hover{background:rgba(0,0,0,0.04)}
  .card-modal-desc p{margin:0 0 6px}.card-modal-desc p:last-child{margin-bottom:0}
  .card-modal-desc ol{padding-left:20px;margin:0 0 6px}
  .card-modal-desc ul{list-style:none;padding:0;margin:0 0 6px}
  .card-modal-desc ul li{padding-left:14px;position:relative;margin-bottom:3px}
  .card-modal-desc ul li::before{content:'';display:inline-block;width:5px;height:5px;background:#2C4A14;position:absolute;left:0;top:7px;border-radius:1px}
  .card-modal-desc ol li{margin-bottom:3px}
  .card-modal-desc-empty{color:var(--ink-3);font-style:italic}
  .card-modal-desc-edit{display:none}
  .card-modal-desc-edit.active{display:block}
  .card-modal-desc-edit textarea{display:block;width:100%;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:white;color:var(--ink);outline:none;resize:vertical;min-height:120px;line-height:1.6}
  .card-modal-desc-edit textarea:focus{border-color:#B85C2C}
  .card-modal-desc-edit-actions{display:flex;gap:8px;margin-top:6px;align-items:center}
  .cmd-desc-save{font-size:12px;font-weight:600;background:#B85C2C;color:white;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-family:inherit}
  .cmd-desc-save:hover{opacity:0.88}.cmd-desc-save:active{transform:scale(0.97)}
  .cmd-desc-cancel{font-size:12px;font-weight:600;background:none;color:var(--ink-3);border:none;cursor:pointer;font-family:inherit;padding:6px 4px}
  .cmd-desc-cancel:hover{color:var(--ink)}
  .card-modal-notes-list{margin-bottom:8px}
  .card-modal-note{display:flex;align-items:flex-start;gap:6px;background:#FFFBF0;border:0.5px solid #F0E0A0;border-radius:6px;padding:6px 8px;color:#5C4A00;line-height:1.5;margin-bottom:4px;font-size:12px;user-select:text}
  .card-modal-note-text{flex:1}
  .card-modal-note-del{background:none;border:none;cursor:pointer;color:#B09020;font-size:16px;line-height:1;padding:0 2px;flex-shrink:0;opacity:0.55;transition:opacity 0.1s ease;font-family:inherit}
  .card-modal-note-del:hover{opacity:1}
  .card-modal-nonotes{font-size:12px;color:var(--ink-3);margin-bottom:8px}
  .card-modal-note-add-row{display:flex;gap:6px;align-items:center}
  .card-modal-note-input{flex:1;font-size:12px;font-family:inherit;border:0.5px solid var(--border);border-radius:6px;padding:6px 10px;background:white;color:var(--ink);outline:none}
  .card-modal-note-input:focus{border-color:var(--brand)}
  .card-modal-note-add-btn{font-size:11px;font-weight:600;background:var(--brand-tint);color:var(--brand);border:1px solid rgba(44,74,20,0.2);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .card-modal-note-add-btn:hover{background:var(--brand-light)}.card-modal-note-add-btn:active{transform:scale(0.97)}
  .card-modal-status-select{font-size:12px;font-weight:600;font-family:inherit;border:1px solid var(--border);border-radius:6px;padding:5px 10px;background:white;color:var(--ink);cursor:pointer;outline:none;width:100%}
  .card-modal-status-select:focus{border-color:var(--brand)}
  .card-modal-status-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-block}
  .cms-backlog{background:#e8e8e8;color:#555}
  .cms-inprogress{background:#FFF3D6;color:#B07020}
  .cms-done{background:#E8F0DC;color:#2C4A14}
  .cms-blocker{background:#FCE8E8;color:#C04040}
  .card-modal-tags-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:4px}
  .card-modal-tag-pill{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg);border:0.5px solid var(--border);color:var(--ink-2)}
  .card-modal-tag-pill-del{background:none;border:none;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1;padding:0 1px;margin-left:2px;opacity:0.7;transition:opacity 0.1s;font-family:inherit}
  .card-modal-tag-pill-del:hover{opacity:1;color:var(--ink)}
  .card-modal-tag-input-row{display:flex;gap:6px}
  .card-modal-tag-input{flex:1;font-size:11px;font-family:inherit;border:0.5px solid var(--border);border-radius:6px;padding:5px 8px;background:white;color:var(--ink);outline:none}
  .card-modal-tag-input:focus{border-color:var(--brand)}
  .card-modal-copy{font-size:12px;font-weight:600;background:var(--brand-tint);color:var(--brand);border:1px solid rgba(44,74,20,0.2);border-radius:6px;padding:7px 14px;cursor:pointer;font-family:inherit;transition:background 0.15s ease;width:100%;text-align:center}
  .card-modal-copy:hover{background:var(--brand-light)}.card-modal-copy:active{transform:scale(0.97)}
  .card-modal-delete{font-size:12px;font-weight:600;background:none;color:rgba(192,57,43,0.6);border:1px solid rgba(192,57,43,0.25);border-radius:6px;padding:7px 14px;cursor:pointer;font-family:inherit;width:100%;text-align:center;transition:all 0.15s ease;margin-top:6px}
  .card-modal-delete:hover{color:#C0392B;border-color:#C0392B;background:rgba(192,57,43,0.05)}.card-modal-delete:active{transform:scale(0.97)}
  .card-modal-card-id{font-size:11px;color:var(--ink-3)}

  }

  // ---- one-time migration ----
  function runMigrationIfNeeded() {
    if (localStorage.getItem(STORE_MIGRATED) === '1') return;
    var existing = getCustomCards();
    var existingIds = {};
    existing.forEach(function(c) { existingIds[c.id] = true; });
    MIGRATED_CARDS.forEach(function(card) {
      if (!existingIds[card.id]) existing.push(card);
    });
    saveCustomCards(existing);
    localStorage.setItem(STORE_MIGRATED, '1');
  }

  // ---- note helpers ----
  window.showNoteInput = function(id) {
    var w = document.getElementById('input-' + id);
    if (w) w.classList.toggle('visible');
  };

  window.saveNote = function(id) {
    var input = document.getElementById('text-' + id);
    if (!input || !input.value.trim()) return;
    var notes = JSON.parse(localStorage.getItem('sniffout-notes-' + id) || '[]');
    notes.push(input.value.trim());
    localStorage.setItem('sniffout-notes-' + id, JSON.stringify(notes));
    input.value = '';
    document.getElementById('input-' + id).classList.remove('visible');
    renderNotes(id);
    touchLastUpdated();
  };

  function renderNotes(id) {
    var c = document.getElementById('notes-' + id);
    if (!c) return;
    var notes = JSON.parse(localStorage.getItem('sniffout-notes-' + id) || '[]');
    c.innerHTML = notes.map(function(n) {
      return '<div class="card-note-item">' + escH(n) + '</div>';
    }).join('');
  }

  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---- card building ----
  function buildCardEl(card) {
    var div = document.createElement('div');
    var cls = 'card';
    if (card.isBlocker) cls += ' blocker';
    if (card.column === 'done') cls += ' done-card';
    div.className = cls;
    div.id = card.id;
    div.setAttribute('draggable', 'true');
    div.setAttribute('data-custom', '1');

    var top = document.createElement('div');
    top.className = 'card-top';
    var titleEl = document.createElement('div');
    titleEl.className = 'card-title';
    titleEl.textContent = card.title;
    top.appendChild(titleEl);

    if (card.column === 'done') {
      var chk = document.createElement('div');
      chk.className = 'card-done-check';
      chk.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
      top.appendChild(chk);
    } else if (card.tags && card.tags.length) {
      var tagEl = document.createElement('div');
      var tagClass = card.isBlocker ? 'tag-blocker' : getTagClass(card.tags[0]);
      tagEl.className = 'card-tag ' + tagClass;
      tagEl.textContent = card.tags[0];
      top.appendChild(tagEl);
    }
    div.appendChild(top);

    if (card.body) {
      var body = document.createElement('div');
      body.className = 'card-body';
      body.textContent = card.body;
      div.appendChild(body);
    }

    // footer labels: tags[1..n]
    if (card.tags && card.tags.length > 1) {
      var footer = document.createElement('div');
      footer.className = 'card-footer';
      card.tags.slice(1).forEach(function(t) {
        var lbl = document.createElement('div');
        lbl.className = 'card-label';
        lbl.textContent = t;
        footer.appendChild(lbl);
      });
      div.appendChild(footer);
    }

    // move button (touch devices)
    var moveBtn = document.createElement('button');
    moveBtn.className = 'card-move-btn';
    moveBtn.textContent = 'Move to...';
    var moveSel = document.createElement('select');
    moveSel.className = 'card-move-select';
    moveBtn.onclick = function() { moveSel.style.display = moveSel.style.display === 'block' ? 'none' : 'block'; };
    buildMoveSelect(moveSel, card.id, card.column, true);
    div.appendChild(moveBtn);
    div.appendChild(moveSel);

    // notes
    var notesWrap = document.createElement('div');
    notesWrap.className = 'card-notes';
    var notesHdr = document.createElement('div');
    notesHdr.style.cssText = 'display:flex;align-items:center;justify-content:space-between;';
    var notesLbl = document.createElement('div');
    notesLbl.className = 'card-notes-label';
    notesLbl.textContent = 'Notes';
    var notesAdd = document.createElement('button');
    notesAdd.className = 'card-notes-add';
    notesAdd.textContent = '+ Add note';
    (function(id) { notesAdd.onclick = function() { window.showNoteInput(id); }; })(card.id);
    notesHdr.appendChild(notesLbl);
    notesHdr.appendChild(notesAdd);
    notesWrap.appendChild(notesHdr);
    var notesList = document.createElement('div');
    notesList.id = 'notes-' + card.id;
    notesWrap.appendChild(notesList);
    var noteInputWrap = document.createElement('div');
    noteInputWrap.className = 'card-note-input-wrap';
    noteInputWrap.id = 'input-' + card.id;
    var noteInput = document.createElement('input');
    noteInput.className = 'card-note-input';
    noteInput.id = 'text-' + card.id;
    noteInput.placeholder = 'Add a note...';
    (function(id) { noteInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') window.saveNote(id); }); })(card.id);
    var noteSaveBtn = document.createElement('button');
    noteSaveBtn.className = 'card-note-save';
    noteSaveBtn.textContent = 'Save';
    (function(id) { noteSaveBtn.onclick = function() { window.saveNote(id); }; })(card.id);
    noteInputWrap.appendChild(noteInput);
    noteInputWrap.appendChild(noteSaveBtn);
    notesWrap.appendChild(noteInputWrap);
    div.appendChild(notesWrap);

    // edit button
    var editBtn = document.createElement('button');
    editBtn.className = 'card-edit-btn';
    editBtn.textContent = 'Edit';
    (function(id) { editBtn.onclick = function() { window.toggleEditPanel(id); }; })(card.id);
    div.appendChild(editBtn);
    div.appendChild(buildEditPanel(card.id, true));

    addDragListeners(div);
    return div;
  }

  function buildMoveSelect(sel, cardId, currentCol, isCustom) {
    sel.innerHTML = '';
    var opt0 = document.createElement('option');
    opt0.value = '';
    opt0.textContent = 'Move to...';
    sel.appendChild(opt0);
    COLS.filter(function(c) { return c !== currentCol; }).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c;
      opt.textContent = COL_LABELS[c];
      sel.appendChild(opt);
    });
    sel.onchange = function() { if (sel.value) window.moveCard(cardId, sel.value, isCustom); };
  }

  function buildEditPanel(cardId, isCustom) {
    var wrap = document.createElement('div');
    wrap.className = 'card-edit-panel';
    wrap.id = 'edit-panel-' + cardId;
    var titleIn = document.createElement('input');
    titleIn.id = 'edit-title-' + cardId;
    titleIn.placeholder = 'Title';
    var bodyIn = document.createElement('textarea');
    bodyIn.id = 'edit-body-' + cardId;
    bodyIn.placeholder = 'Description';
    bodyIn.rows = 2;
    var tagIn = document.createElement('input');
    tagIn.id = 'edit-tag-' + cardId;
    tagIn.placeholder = 'Tag (e.g. Dev, Design, Blocker, Owner)';
    var actions = document.createElement('div');
    actions.className = 'card-edit-actions';
    var saveBtn = document.createElement('button');
    saveBtn.className = 'card-edit-save';
    saveBtn.textContent = 'Save';
    (function(id, c) { saveBtn.onclick = function() { window.saveCardEdit(id, c); }; })(cardId, isCustom);
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'card-edit-cancel';
    cancelBtn.textContent = 'Cancel';
    (function(id) { cancelBtn.onclick = function() { window.toggleEditPanel(id); }; })(cardId);
    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    wrap.appendChild(titleIn);
    wrap.appendChild(bodyIn);
    wrap.appendChild(tagIn);
    wrap.appendChild(actions);
    return wrap;
  }

  window.toggleEditPanel = function(cardId) {
    var panel = document.getElementById('edit-panel-' + cardId);
    if (!panel) return;
    var opening = !panel.classList.contains('open');
    if (opening) {
      var card = document.getElementById(cardId);
      var titleEl = card ? card.querySelector('.card-title') : null;
      var bodyEl = card ? card.querySelector('.card-body') : null;
      var tagEl = card ? card.querySelector('.card-tag') : null;
      var ti = document.getElementById('edit-title-' + cardId);
      var bi = document.getElementById('edit-body-' + cardId);
      var tagi = document.getElementById('edit-tag-' + cardId);
      if (ti && titleEl) ti.value = titleEl.textContent;
      if (bi) bi.value = bodyEl ? bodyEl.textContent : '';
      if (tagi) tagi.value = tagEl ? tagEl.textContent : '';
    }
    panel.classList.toggle('open', opening);
  };

  window.saveCardEdit = function(cardId, isCustom) {
    var card = document.getElementById(cardId);
    if (!card) return;
    var ti = document.getElementById('edit-title-' + cardId);
    var bi = document.getElementById('edit-body-' + cardId);
    var tagi = document.getElementById('edit-tag-' + cardId);
    if (!ti || !ti.value.trim()) return;
    var newTitle = ti.value.trim();
    var newBody = bi ? bi.value.trim() : '';
    var newTag = tagi ? tagi.value.trim() : '';
    var titleEl = card.querySelector('.card-title');
    if (titleEl) titleEl.textContent = newTitle;
    var bodyEl = card.querySelector('.card-body');
    if (newBody) {
      if (bodyEl) bodyEl.textContent = newBody;
      else {
        var nb = document.createElement('div');
        nb.className = 'card-body';
        nb.textContent = newBody;
        var cardTop = card.querySelector('.card-top');
        if (cardTop && cardTop.nextSibling) card.insertBefore(nb, cardTop.nextSibling);
        else card.appendChild(nb);
      }
    } else if (bodyEl) { bodyEl.textContent = ''; }
    var tagEl2 = card.querySelector('.card-tag');
    if (newTag) {
      if (tagEl2) { tagEl2.textContent = newTag; tagEl2.className = 'card-tag ' + getTagClass(newTag); }
      else {
        var nt = document.createElement('div');
        nt.className = 'card-tag ' + getTagClass(newTag);
        nt.textContent = newTag;
        var ct = card.querySelector('.card-top');
        if (ct) ct.appendChild(nt);
      }
    } else if (tagEl2) { tagEl2.remove(); }
    if (isCustom) {
      var all = getCustomCards();
      for (var i = 0; i < all.length; i++) {
        if (all[i].id === cardId) {
          all[i].title = newTitle;
          all[i].body = newBody;
          if (all[i].tags && all[i].tags.length) all[i].tags[0] = newTag;
          else all[i].tags = [newTag];
          break;
        }
      }
      saveCustomCards(all);
    } else {
      var edits = getEdits();
      edits[cardId] = {title: newTitle, body: newBody, tag: newTag};
      saveEdits(edits);
    }
    var panel = document.getElementById('edit-panel-' + cardId);
    if (panel) panel.classList.remove('open');
    touchLastUpdated();
  };

  function addDragListeners(el) {
    el.addEventListener('dragstart', function(e) {
      dragging = el;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', el.id);
      setTimeout(function() { el.classList.add('dragging'); }, 0);
    });
    el.addEventListener('dragend', function() { el.classList.remove('dragging'); dragging = null; });
  }

  function setupDropZone(col) {
    var container = document.getElementById('cards-' + col);
    if (!container) return;
    container.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; container.classList.add('drag-over'); });
    container.addEventListener('dragenter', function(e) { e.preventDefault(); container.classList.add('drag-over'); });
    container.addEventListener('dragleave', function(e) { if (!container.contains(e.relatedTarget)) container.classList.remove('drag-over'); });
    container.addEventListener('drop', function(e) {
      e.preventDefault();
      container.classList.remove('drag-over');
      var id = (dragging && dragging.id) || e.dataTransfer.getData('text/plain');
      if (!id) return;
      var el = document.getElementById(id);
      var isCustom = !!(el && el.getAttribute('data-custom'));
      window.moveCard(id, col, isCustom);
    });
  }

  window.moveCard = function(cardId, targetCol, isCustom) {
    var el = document.getElementById(cardId);
    if (!el) return;
    var currentCol = null;
    COLS.forEach(function(c) { var cont = document.getElementById('cards-' + c); if (cont && cont.contains(el)) currentCol = c; });
    if (currentCol === targetCol) return;
    var targetContainer = document.getElementById('cards-' + targetCol);
    if (!targetContainer) return;
    // Update done-card class based on target column
    if (targetCol === 'done') {
      el.classList.add('done-card');
      var titleEl = el.querySelector('.card-title');
      if (titleEl) titleEl.style.textDecoration = 'line-through';
      // Replace tag chip with done check if not already there
      var tagChip = el.querySelector('.card-top .card-tag');
      var existingCheck = el.querySelector('.card-done-check');
      if (tagChip && !existingCheck) {
        var chk = document.createElement('div');
        chk.className = 'card-done-check';
        chk.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
        el.querySelector('.card-top').replaceChild(chk, tagChip);
      }
    } else {
      el.classList.remove('done-card');
      var titleEl2 = el.querySelector('.card-title');
      if (titleEl2) titleEl2.style.textDecoration = '';
    }
    targetContainer.appendChild(el);
    if (isCustom) {
      var all = getCustomCards();
      for (var i = 0; i < all.length; i++) {
        if (all[i].id === cardId) { all[i].column = targetCol; break; }
      }
      saveCustomCards(all);
    } else {
      var moves = getMoves();
      moves[cardId] = targetCol;
      saveMoves(moves);
    }
    var moveSel = el.querySelector('.card-move-select');
    if (moveSel) { buildMoveSelect(moveSel, cardId, targetCol, isCustom); moveSel.style.display = 'none'; }
    updateCounts();
    touchLastUpdated();
  };

  function updateCounts() {
    var blockerCount = 0;
    COLS.forEach(function(col) {
      var cont = document.getElementById('cards-' + col);
      var cards = cont ? cont.querySelectorAll('.card') : [];
      var n = cards.length;
      var badge = document.getElementById('count-' + col);
      var stat = document.getElementById('stat-' + col);
      if (badge) badge.textContent = n;
      if (stat) stat.textContent = n;
      if (col === 'backlog') {
        cards.forEach(function(c) { if (c.classList.contains('blocker')) blockerCount++; });
      }
    });
    var bstat = document.getElementById('stat-blockers');
    if (bstat) bstat.textContent = blockerCount;
  }

  // ---- add card form ----
  window.showAddForm = function(col) {
    COLS.forEach(function(c) { var f = document.getElementById('add-form-' + c); if (f) f.classList.remove('visible'); });
    var f = document.getElementById('add-form-' + col);
    if (!f) return;
    f.classList.add('visible');
    var ti = document.getElementById('add-title-' + col);
    if (ti) ti.focus();
  };

  window.hideAddForm = function(col) {
    var f = document.getElementById('add-form-' + col);
    if (!f) return;
    f.classList.remove('visible');
    ['add-title-', 'add-body-', 'add-tags-'].forEach(function(p) { var el = document.getElementById(p + col); if (el) el.value = ''; });
  };

  window.submitCard = function(col) {
    var titleEl = document.getElementById('add-title-' + col);
    if (!titleEl || !titleEl.value.trim()) { if (titleEl) titleEl.focus(); return; }
    var title = titleEl.value.trim();
    var body = (document.getElementById('add-body-' + col) || {value:''}).value.trim();
    var tagsRaw = (document.getElementById('add-tags-' + col) || {value:''}).value;
    var tags = tagsRaw.split(',').map(function(t) { return t.trim(); }).filter(Boolean);
    var card = {id: 'custom-' + Date.now(), title: title, body: body, tags: tags, column: col, isBlocker: false};
    var all = getCustomCards();
    all.push(card);
    saveCustomCards(all);
    var container = document.getElementById('cards-' + col);
    if (container) { var el = buildCardEl(card); container.appendChild(el); renderNotes(card.id); }
    window.hideAddForm(col);
    updateCounts();
    touchLastUpdated();
  };

  // ---- render all cards from localStorage ----
  function renderAllCards() {
    var cards = getCustomCards();
    // Apply any legacy moves to the cards
    var moves = getMoves();
    cards.forEach(function(c) {
      if (moves[c.id]) c.column = moves[c.id];
    });

    COLS.forEach(function(col) {
      var container = document.getElementById('cards-' + col);
      if (!container) return;
      container.innerHTML = '';
      var colCards = cards.filter(function(c) { return c.column === col; });
      var lastSection = null;
      colCards.forEach(function(card) {
        // Insert section label if this card starts a new section
        if (card.sectionLabel && card.sectionLabel !== lastSection) {
          var sl = document.createElement('div');
          sl.className = 'section-label';
          sl.textContent = card.sectionLabel;
          container.appendChild(sl);
          lastSection = card.sectionLabel;
        } else if (!card.sectionLabel) {
          lastSection = null;
        }
        var el = buildCardEl(card);
        container.appendChild(el);
        renderNotes(card.id);
      });
    });
  }

  // ---- checklist functions (website card) ----
  window.toggleChecklist = function(id) {
    var w = document.getElementById('checklist-' + id);
    var b = document.getElementById('toggle-' + id);
    if (!w) return;
    var open = w.classList.toggle('open');
    b.innerHTML = (open ? '&#9660;' : '&#9654;') + ' ' + (open ? 'Hide' : 'Show') + ' walk image checklist';
  };
  window.saveCheck = function(n, cardId) {
    var cb = document.getElementById('chk-' + n);
    if (!cb) return;
    var key = 'sniffout-walk-img-' + cardId;
    var state = JSON.parse(localStorage.getItem(key) || '{}');
    state[n] = cb.checked;
    localStorage.setItem(key, JSON.stringify(state));
    var item = cb.closest('.walk-check-item');
    if (item) item.classList.toggle('checked', cb.checked);
    updateProgress(cardId);
  };
  function updateProgress(cardId) {
    var key = 'sniffout-walk-img-' + cardId;
    var state = JSON.parse(localStorage.getItem(key) || '{}');
    var total = document.querySelectorAll('#checklist-' + cardId + ' .walk-check-item').length;
    var done = Object.values(state).filter(Boolean).length;
    var p = document.getElementById('prog-' + cardId);
    if (p) p.innerHTML = '<span>' + done + '</span> of ' + total + ' images sourced';
  }
  function loadChecklist(cardId) {
    var key = 'sniffout-walk-img-' + cardId;
    var state = JSON.parse(localStorage.getItem(key) || '{}');
    Object.keys(state).forEach(function(n) {
      if (state[n]) {
        var cb = document.getElementById('chk-' + n);
        if (cb) { cb.checked = true; var item = cb.closest('.walk-check-item'); if (item) item.classList.add('checked'); }
      }
    });
    updateProgress(cardId);
  }

  // ---- DOMContentLoaded ----
  document.addEventListener('DOMContentLoaded', function() {
    initLastUpdated();
    runMigrationIfNeeded();
    renderAllCards();
    COLS.forEach(setupDropZone);
    updateCounts();
    loadChecklist('migrated-website');
  });

  // ---- expose for modal script ----
  window._kanban = {
    getCustomCards: getCustomCards,
    saveCustomCards: saveCustomCards,
    getEdits: getEdits,
    saveEdits: saveEdits,
    getMoves: getMoves,
    saveMoves: saveMoves,
    touchLastUpdated: touchLastUpdated,
    updateCounts: updateCounts,
    renderNotes: renderNotes,
    escH: escH,
    COLS: COLS,
    COL_LABELS: COL_LABELS
  };

})();
</script>
<script>
(function(){
  'use strict';
  var _cardId = null, _isBlocker = false, _isCustom = false, _descDirty = false;
  var STORE_DELETED = 'sniffout-kanban-deleted';

  function kb() { return window._kanban; }

  function escH(s) { return kb().escH(s); }

  function fmtBody(txt) {
    if (!txt || !txt.trim()) return '<span class="card-modal-desc-empty">Click to add a description...</span>';
    var lines = txt.split('\n'), html = '', i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^\d+\./.test(l)) {
        html += '<ol>';
        while (i < lines.length && /^\d+\./.test(lines[i])) {
          html += '<li>' + escH(lines[i].replace(/^\d+\.\s*/,'')) + '</li>';
          i++;
        }
        html += '</ol>';
      } else if (/^-\s/.test(l)) {
        html += '<ul>';
        while (i < lines.length && /^-\s/.test(lines[i])) {
          html += '<li>' + escH(lines[i].replace(/^-\s*/,'')) + '</li>';
          i++;
        }
        html += '</ul>';
      } else {
        if (l.trim()) html += '<p>' + escH(l) + '</p>';
        i++;
      }
    }
    return html || '<span class="card-modal-desc-empty">Click to add a description...</span>';
  }

  function getColForCard(card) {
    var COLS = kb().COLS;
    for (var i = 0; i < COLS.length; i++) {
      var c = document.getElementById('cards-' + COLS[i]);
      if (c && c.contains(card)) return COLS[i];
    }
    return 'backlog';
  }

  function getTitleText(card) {
    var el = card.querySelector('.card-title');
    if (!el) return '';
    var tc = el.cloneNode(true);
    tc.querySelectorAll('button,.card-checklist-toggle,.card-checklist-wrap').forEach(function(e) { e.remove(); });
    return tc.textContent.trim();
  }

  function getCardBody(card) {
    var el = card.querySelector('.card-body');
    return el ? el.textContent.trim() : '';
  }

  function getTagClass(t) {
    t = (t||'').toLowerCase();
    if (t==='dev'||t==='developer') return 'tag-dev';
    if (t==='design'||t==='designer') return 'tag-design';
    if (t==='owner') return 'tag-owner';
    if (t==='research') return 'tag-research';
    if (t==='blocker') return 'tag-blocker';
    if (t==='copy'||t==='copywriter') return 'tag-copy';
    return 'tag-dev';
  }

  function getTagsFromCard(card) {
    var tags = [];
    var tagEl = card.querySelector('.card-top .card-tag');
    if (tagEl) {
      var t = '';
      tagEl.childNodes.forEach(function(n) { if (n.nodeType === 3) t += n.textContent; });
      t = t.trim();
      if (t) tags.push(t);
    }
    card.querySelectorAll('.card-footer .card-label').forEach(function(lbl) {
      var t2 = lbl.textContent.trim();
      if (t2) tags.push(t2);
    });
    return tags;
  }

  function renderModalNotes() {
    if (!_cardId) return;
    var notes = JSON.parse(localStorage.getItem('sniffout-notes-' + _cardId) || '[]');
    var c = document.getElementById('cmd-notes');
    if (!c) return;
    if (notes.length) {
      c.innerHTML = notes.map(function(n, i) {
        return '<div class="card-modal-note"><span class="card-modal-note-text">' + escH(n) + '</span>'
          + '<button class="card-modal-note-del" data-idx="' + i + '" title="Delete">&times;</button></div>';
      }).join('');
    } else {
      c.innerHTML = '<div class="card-modal-nonotes">No notes yet.</div>';
    }
  }

  function renderModalTags() {
    if (!_cardId) return;
    var card = document.getElementById(_cardId);
    if (!card) return;
    var tags = getTagsFromCard(card);
    var wrap = document.getElementById('cmd-tags');
    if (!wrap) return;
    wrap.innerHTML = tags.map(function(t, i) {
      var html = '<span class="card-modal-tag-pill">' + escH(t);
      if (!_isBlocker) html += '<button class="card-modal-tag-pill-del" data-idx="' + i + '" title="Remove">&times;</button>';
      html += '</span>';
      return html;
    }).join('');
  }

  function saveTagsToCard(tags) {
    var card = document.getElementById(_cardId);
    if (!card) return;
    var existingTag = card.querySelector('.card-top .card-tag');
    if (existingTag) existingTag.remove();
    if (tags.length) {
      var nt = document.createElement('div');
      nt.className = 'card-tag ' + getTagClass(tags[0]);
      nt.textContent = tags[0];
      card.querySelector('.card-top').appendChild(nt);
    }
    var footer = card.querySelector('.card-footer');
    if (tags.length > 1) {
      if (!footer) {
        footer = document.createElement('div');
        footer.className = 'card-footer';
        var anchor = card.querySelector('.card-notes') || card.querySelector('.card-move-btn') || card.querySelector('.card-edit-btn');
        if (anchor) card.insertBefore(footer, anchor);
        else card.appendChild(footer);
      } else { footer.innerHTML = ''; }
      tags.slice(1).forEach(function(t) {
        var lbl = document.createElement('div');
        lbl.className = 'card-label';
        lbl.textContent = t;
        footer.appendChild(lbl);
      });
    } else if (footer) { footer.innerHTML = ''; }
    persistFields({tags: tags});
  }

  function getSectionLabelForCard(cardId) {
    var all = kb().getCustomCards();
    for (var i = 0; i < all.length; i++) {
      if (all[i].id === cardId) return all[i].sectionLabel || '';
    }
    return '';
  }

  function persistFields(fields) {
    if (!_cardId) return;
    if (_isCustom) {
      var all = kb().getCustomCards();
      for (var i = 0; i < all.length; i++) {
        if (all[i].id === _cardId) {
          if (fields.title !== undefined) all[i].title = fields.title;
          if (fields.body !== undefined) all[i].body = fields.body;
          if (fields.tags !== undefined) all[i].tags = fields.tags;
          if (fields.sectionLabel !== undefined) all[i].sectionLabel = fields.sectionLabel;
          break;
        }
      }
      kb().saveCustomCards(all);
    } else {
      var edits = kb().getEdits();
      if (!edits[_cardId]) edits[_cardId] = {};
      if (fields.title !== undefined) edits[_cardId].title = fields.title;
      if (fields.body !== undefined) edits[_cardId].body = fields.body;
      if (fields.tags !== undefined && fields.tags.length) edits[_cardId].tag = fields.tags[0];
      kb().saveEdits(edits);
    }
  }

  function openModal(card) {
    _cardId = card.id;
    _isBlocker = card.classList.contains('blocker');
    _isCustom = !!(card.getAttribute('data-custom'));
    _descDirty = false;

    var titleEl = document.getElementById('cmd-title');
    titleEl.textContent = getTitleText(card);
    titleEl.contentEditable = _isBlocker ? 'false' : 'true';
    titleEl.style.cursor = _isBlocker ? 'default' : 'text';

    var bodyText = getCardBody(card);
    document.getElementById('cmd-desc').innerHTML = fmtBody(bodyText);
    document.getElementById('cmd-desc').style.display = '';
    document.getElementById('cmd-desc-edit').classList.remove('active');
    document.getElementById('cmd-desc-ta').value = bodyText;
    if (_isBlocker) {
      document.getElementById('cmd-desc').style.cursor = 'default';
    } else {
      document.getElementById('cmd-desc').style.cursor = 'pointer';
    }

    renderModalNotes();

    var col = getColForCard(card);
    var statusWrap = document.getElementById('cmd-status-wrap');
    statusWrap.innerHTML = '';
    if (_isBlocker) {
      statusWrap.innerHTML = '<span class="card-modal-status-pill cms-blocker">Hard Blocker</span>';
    } else {
      var sel = document.createElement('select');
      sel.className = 'card-modal-status-select';
      kb().COLS.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = kb().COL_LABELS[c];
        if (c === col) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', function() {
        if (sel.value) window.moveCard(_cardId, sel.value, _isCustom);
      });
      statusWrap.appendChild(sel);
    }

    // Section label field
    var slSection = document.getElementById('cmd-section-label-section');
    var slInput = document.getElementById('cmd-section-label-input');
    if (!_isBlocker) {
      slSection.style.display = '';
      slInput.value = getSectionLabelForCard(_cardId);
    } else {
      slSection.style.display = 'none';
    }

    renderModalTags();
    document.getElementById('cmd-tags-input-row').style.display = _isBlocker ? 'none' : '';
    document.getElementById('cmd-tag-input').value = '';
    document.getElementById('cmd-delete').style.display = _isBlocker ? 'none' : 'block';
    document.getElementById('cmd-copy').textContent = 'Copy card';
    document.getElementById('cmd-id').textContent = _cardId;

    document.getElementById('card-modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function maybeClose() {
    if (_descDirty) { if (!confirm('You have unsaved changes. Close anyway?')) return; }
    closeModal();
  }

  function closeModal() {
    _descDirty = false;
    document.getElementById('card-modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
    _cardId = null;
  }

  // --- Title inline editing ---
  var titleEl = document.getElementById('cmd-title');
  titleEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); } });
  titleEl.addEventListener('blur', function() {
    if (!_cardId || _isBlocker) return;
    var newTitle = (titleEl.textContent || '').trim();
    var card = document.getElementById(_cardId);
    if (!card) return;
    if (!newTitle) { titleEl.textContent = getTitleText(card); return; }
    var cardTitleEl = card.querySelector('.card-title');
    if (cardTitleEl) cardTitleEl.textContent = newTitle;
    persistFields({title: newTitle});
    kb().touchLastUpdated();
  });

  // --- Description click to edit ---
  document.getElementById('cmd-desc').addEventListener('click', function() {
    if (_isBlocker) return;
    var card = document.getElementById(_cardId);
    document.getElementById('cmd-desc-ta').value = card ? getCardBody(card) : '';
    document.getElementById('cmd-desc').style.display = 'none';
    document.getElementById('cmd-desc-edit').classList.add('active');
    document.getElementById('cmd-desc-ta').focus();
    _descDirty = false;
  });
  document.getElementById('cmd-desc-ta').addEventListener('input', function() { _descDirty = true; });
  document.getElementById('cmd-desc-save-btn').addEventListener('click', function() {
    if (!_cardId) return;
    var newBody = document.getElementById('cmd-desc-ta').value.trim();
    var card = document.getElementById(_cardId);
    if (card) {
      var bodyEl = card.querySelector('.card-body');
      if (newBody) {
        if (bodyEl) { bodyEl.textContent = newBody; }
        else {
          var nb = document.createElement('div');
          nb.className = 'card-body';
          nb.textContent = newBody;
          var ct = card.querySelector('.card-top');
          if (ct && ct.nextSibling) card.insertBefore(nb, ct.nextSibling);
          else card.appendChild(nb);
        }
      } else { if (bodyEl) bodyEl.textContent = ''; }
    }
    persistFields({body: newBody});
    document.getElementById('cmd-desc').innerHTML = fmtBody(newBody);
    document.getElementById('cmd-desc').style.display = '';
    document.getElementById('cmd-desc-edit').classList.remove('active');
    _descDirty = false;
    kb().touchLastUpdated();
  });
  document.getElementById('cmd-desc-cancel-btn').addEventListener('click', function() {
    document.getElementById('cmd-desc').style.display = '';
    document.getElementById('cmd-desc-edit').classList.remove('active');
    _descDirty = false;
  });

  // --- Section label ---
  document.getElementById('cmd-section-label-input').addEventListener('blur', function() {
    if (!_cardId || _isBlocker) return;
    var val = (this.value || '').trim();
    persistFields({sectionLabel: val || undefined});
    kb().touchLastUpdated();
  });
  document.getElementById('cmd-section-label-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
  });

  // --- Notes ---
  document.getElementById('cmd-notes').addEventListener('click', function(e) {
    var btn = e.target.closest('.card-modal-note-del');
    if (!btn || !_cardId) return;
    var idx = parseInt(btn.getAttribute('data-idx'), 10);
    var notes = JSON.parse(localStorage.getItem('sniffout-notes-' + _cardId) || '[]');
    notes.splice(idx, 1);
    localStorage.setItem('sniffout-notes-' + _cardId, JSON.stringify(notes));
    renderModalNotes();
    var notesEl = document.getElementById('notes-' + _cardId);
    if (notesEl) {
      notesEl.innerHTML = notes.map(function(n) { return '<div class="card-note-item">' + escH(n) + '</div>'; }).join('');
    }
    kb().touchLastUpdated();
  });
  function addModalNote() {
    if (!_cardId) return;
    var input = document.getElementById('cmd-note-input');
    var val = (input.value || '').trim();
    if (!val) return;
    var notes = JSON.parse(localStorage.getItem('sniffout-notes-' + _cardId) || '[]');
    notes.push(val);
    localStorage.setItem('sniffout-notes-' + _cardId, JSON.stringify(notes));
    input.value = '';
    renderModalNotes();
    var notesEl = document.getElementById('notes-' + _cardId);
    if (notesEl) {
      notesEl.innerHTML = notes.map(function(n) { return '<div class="card-note-item">' + escH(n) + '</div>'; }).join('');
    }
    kb().touchLastUpdated();
  }
  document.getElementById('cmd-note-add-btn').addEventListener('click', addModalNote);
  document.getElementById('cmd-note-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') addModalNote(); });

  // --- Tags ---
  document.getElementById('cmd-tags').addEventListener('click', function(e) {
    var btn = e.target.closest('.card-modal-tag-pill-del');
    if (!btn || !_cardId || _isBlocker) return;
    var idx = parseInt(btn.getAttribute('data-idx'), 10);
    var card = document.getElementById(_cardId);
    if (!card) return;
    var tags = getTagsFromCard(card);
    tags.splice(idx, 1);
    saveTagsToCard(tags);
    renderModalTags();
    kb().touchLastUpdated();
  });
  document.getElementById('cmd-tag-input').addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    if (!_cardId || _isBlocker) return;
    var val = (this.value || '').trim();
    if (!val) return;
    var card = document.getElementById(_cardId);
    if (!card) return;
    var tags = getTagsFromCard(card);
    tags.push(val);
    saveTagsToCard(tags);
    this.value = '';
    renderModalTags();
    kb().touchLastUpdated();
  });

  // --- Copy ---
  document.getElementById('cmd-copy').addEventListener('click', function() {
    if (!_cardId) return;
    var card = document.getElementById(_cardId);
    var title = getTitleText(card) || '';
    var body = getCardBody(card) || '';
    var text = title + (body ? '\n\n' + body : '');
    var btn = this;
    function onCopy() { btn.textContent = 'Copied!'; setTimeout(function() { btn.textContent = 'Copy card'; }, 1500); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); onCopy(); } catch(ex) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(onCopy).catch(fallback); }
    else { fallback(); }
  });

  // --- Delete ---
  document.getElementById('cmd-delete').addEventListener('click', function() {
    if (!_cardId || _isBlocker) return;
    if (!confirm('Delete this card? This cannot be undone.')) return;
    var id = _cardId;
    var card = document.getElementById(id);
    if (card) card.remove();
    if (_isCustom) {
      var all = kb().getCustomCards();
      all = all.filter(function(c) { return c.id !== id; });
      kb().saveCustomCards(all);
    } else {
      var del = JSON.parse(localStorage.getItem(STORE_DELETED) || '[]');
      if (del.indexOf(id) === -1) del.push(id);
      localStorage.setItem(STORE_DELETED, JSON.stringify(del));
    }
    localStorage.removeItem('sniffout-notes-' + id);
    closeModal();
    kb().updateCounts();
    kb().touchLastUpdated();
  });

  // --- Close handlers ---
  document.getElementById('cmd-close-x').addEventListener('click', maybeClose);
  document.getElementById('cmd-close-ftr').addEventListener('click', maybeClose);
  document.getElementById('card-modal-overlay').addEventListener('click', function(e) { if (e.target === this) maybeClose(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('card-modal-overlay').classList.contains('open')) maybeClose();
  });

  // --- Card click trigger ---
  document.addEventListener('click', function(e) {
    if (!e.target.closest) return;
    var inTitle = e.target.closest('.card-title'), inBody = e.target.closest('.card-body');
    if (!inTitle && !inBody) return;
    if (e.target.closest('.card-edit-panel') || e.target.closest('.card-note-input-wrap') ||
        e.target.closest('.card-notes-add') || e.target.closest('.card-edit-btn') ||
        e.target.closest('.card-move-btn') || e.target.closest('.card-move-select') ||
        e.target.closest('.card-checklist-wrap') || e.target.closest('.card-checklist-toggle') ||
        e.target.closest('.add-card-form')) return;
    var card = e.target.closest('.card');
    if (!card) return;
    openModal(card);
  });

  // expose openModal
  window._openModal = openModal;

})();
</script>
</body>
</html>
